apiVersion: v1
kind: Pod
metadata:
  name: pollen-train-species
  namespace: stenc-ns
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
        - name: train-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "Preparing container paths..."
              mkdir -p /app/dataset_species /app/models/species_classifier
              
              echo "Downloading generated classification datasets via S3..."
              aws --endpoint-url "$S3_ENDPOINT" s3 sync "s3://$S3_BUCKET/PEG/Colorado/Species_model/Trainig_data/" /app/dataset_species/ --no-verify-ssl
              
              echo "Starting YOLOv8 Species Classification Training..."
              export MODEL_DIR=/app/models/species_classifier/
              
              echo "Extracting classification crops from tiles..."
              python3 /scripts/extract_crops.py --src /app/dataset_species --out /app/classification_dataset
              
              python3 /scripts/train_species.py --dataset /app/classification_dataset
              
              echo "Uploading best weights to S3..."
              s5cmd --endpoint-url "$S3_ENDPOINT" --no-verify-ssl sync "/app/models/species_classifier/*" "s3://$S3_BUCKET/PEG/Colorado/trained_models/species_classifier/"
              
              echo "Generating Email notification..."
              python3 /notify/notify.py --type training --job_name "YOLO Species Classifier" --results /app/models/species_classifier/latest.pt
          resources:
            limits:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
          env:
            - name: S3_ENDPOINT
              value: "https://s3.cl4.du.cesnet.cz"
            - name: S3_BUCKET
              value: "bucket"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-credentials
                  key: GMAIL_APP_PASSWORD
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /notify
              name: scripts-vol
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: "16Gi"
    - name: scripts-vol
      configMap:
        name: notify-script
