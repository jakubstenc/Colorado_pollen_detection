apiVersion: v1
kind: Pod
metadata:
  name: pollen-train-species
  namespace: stenc-ns
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
        - name: train-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ultralytics/ultralytics:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              export HOME=/tmp
              export PATH=$PATH:$HOME/.local/bin
              cd /tmp
              
              echo "Bypassing ttl.sh outage: installing dependencies at runtime..."
              pip install --user --no-cache-dir s5cmd boto3 awscli
              
              echo "Preparing container paths..."
              mkdir -p /tmp/dataset_species /tmp/models/species_classifier /tmp/classification_dataset
              
              echo "Downloading generated classification datasets via S3..."
              aws --endpoint-url "$S3_ENDPOINT" s3 sync "s3://$S3_BUCKET/PEG/Colorado/Species_model/Trainig_data/" /tmp/dataset_species/ --no-verify-ssl
              
              echo "Starting YOLOv8 Species Classification Training..."
              export MODEL_DIR=/tmp/models/species_classifier/
              
              echo "Extracting classification crops from tiles..."
              python3 /scripts/extract_crops.py --src /tmp/dataset_species --out /tmp/classification_dataset --target_species Ran_ado
              
              python3 /scripts/train_species.py --dataset /tmp/classification_dataset --target_species Ran_ado
              
              echo "Uploading best weights to S3..."
              aws --endpoint-url "$S3_ENDPOINT" s3 sync "/tmp/models/species_classifier/" "s3://$S3_BUCKET/PEG/Colorado/trained_models/species_classifier/" --no-verify-ssl
              
              echo "Generating Email notification..."
              python3 /notify/notify.py --type training --job_name "YOLO Species Classifier" --results /tmp/models/species_classifier/latest.pt
          resources:
            limits:
              memory: "64Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
            requests:
              memory: "32Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
          env:
            - name: S3_ENDPOINT
              value: "https://s3.cl4.du.cesnet.cz"
            - name: S3_BUCKET
              value: "bucket"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-credentials
                  key: GMAIL_APP_PASSWORD
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /scripts
              name: python-scripts
            - mountPath: /notify
              name: notify-script-vol
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: "32Gi"
    - name: python-scripts
      configMap:
        name: species-train-scripts
    - name: notify-script-vol
      configMap:
        name: notify-script
