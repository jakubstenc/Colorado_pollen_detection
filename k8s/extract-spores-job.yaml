apiVersion: batch/v1
kind: Job
metadata:
  name: pollen-extract-spores
  namespace: stenc-ns
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: extract-spores-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -e
              echo "Preparing container paths..."
              mkdir -p /app/src

              echo "Copying src helper modules..."
              cp /scripts/build_species_dataset.py /app/src/build_species_dataset.py

              echo "Starting Lycopodium spore extraction (classical CV, no model needed)..."
              cd /app
              python3 /scripts/extract_spores.py \
                --max-tiles 200

              echo "Syncing spore tiles to S3..."
              aws --endpoint-url "$S3_ENDPOINT" s3 sync /tmp/spore_extract/output/Lyc_spo/ "s3://$S3_BUCKET/PEG/Colorado/Species_model/Trainig_data/Lyc_spo/" --no-verify-ssl

              echo "Sending completion notification..."
              python3 /scripts/notify.py --type detection --job_name "Lycopodium Spore Extraction"
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "32Gi"
              cpu: "8"
            requests:
              nvidia.com/gpu: 1
              memory: "16Gi"
              cpu: "4"
          env:
            - name: S3_ENDPOINT
              value: "https://s3.cl4.du.cesnet.cz"
            - name: S3_BUCKET
              value: "bucket"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-credentials
                  key: GMAIL_APP_PASSWORD
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /scripts
              name: python-scripts
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "16Gi"
        - name: python-scripts
          configMap:
            name: extract-spores-script
      restartPolicy: Never
  backoffLimit: 0
