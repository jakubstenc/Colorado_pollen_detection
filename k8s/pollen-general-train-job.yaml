apiVersion: v1
kind: Pod
metadata:
  name: pollen-train-general
  namespace: stenc-ns
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
        - name: train-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ttl.sh/pollen-train-anti:24h
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "Starting YOLOv8 training on natively mounted dataset..."
              python3 /home/meow/Documents/Antigravity/Colorado_pollen_detection/src/train_general.py
              
              echo "Generating Email notification..."
              python3 /scripts/notify.py --type training --job_name "YOLO General Pollen Model" --results /home/meow/Documents/Antigravity/Colorado_pollen_detection/models/general_pollen/latest.pt
          resources:
            limits:
              memory: "32Gi"
              cpu: "8"
            requests:
              memory: "16Gi"
              cpu: "4"
          env:
            - name: S3_ENDPOINT
              value: "https://s3.cl4.du.cesnet.cz"
            - name: S3_BUCKET
              value: "bucket"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-credentials
                  key: GMAIL_APP_PASSWORD
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /scripts
              name: scripts-vol
            - mountPath: /home/meow/cesnet_cloud/bucket
              name: s3-bucket-mount
            - mountPath: /home/meow/Documents/Antigravity/Colorado_pollen_detection
              name: project-mount
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: "16Gi"
    - name: scripts-vol
      configMap:
        name: notify-script
    - name: s3-bucket-mount
      hostPath:
        path: /home/meow/cesnet_cloud/bucket
    - name: project-mount
      hostPath:
        path: /home/meow/Documents/Antigravity/Colorado_pollen_detection
